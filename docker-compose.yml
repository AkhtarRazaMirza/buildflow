services:
  postgresdb:
    image: postgres:17
    container_name: ai-project-manager
    restart: unless-stopped

    environment:
      POSTGRES_USER: akhtar
      POSTGRES_PASSWORD: raza
      POSTGRES_DB: dev

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: